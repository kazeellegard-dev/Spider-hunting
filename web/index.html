<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>クモのすハンティング</title>
<meta name="theme-color" content="#2a2244">
<meta name="build" content="web">
<meta name="diag" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="クモハン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/mplus-rounded-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mplus-rounded-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mplus-rounded-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BODY:START -->
<!-- opening: shown from the first frame (same colour as the iOS launch screen) while the
     game boots; main.js lifts it once the game is ready and the short scene has played -->
<div id="intro" aria-hidden="true">
  <div class="istars"><i style="left:12%;top:9%;--d:0.1s"></i><i style="left:28%;top:18%;--d:0.35s"></i><i style="left:71%;top:7%;--d:0.2s"></i><i style="left:86%;top:22%;--d:0.5s"></i><i style="left:8%;top:34%;--d:0.6s"></i><i style="left:92%;top:41%;--d:0.25s"></i><i style="left:18%;top:62%;--d:0.45s"></i><i style="left:83%;top:66%;--d:0.15s"></i><i style="left:55%;top:12%;--d:0.55s"></i><i style="left:40%;top:4%;--d:0.3s"></i><i style="left:63%;top:28%;--d:0.7s"></i><i style="left:6%;top:80%;--d:0.4s"></i><i style="left:94%;top:84%;--d:0.65s"></i><i style="left:30%;top:88%;--d:0.2s"></i></div>
  <div class="imoon"></div>
  <svg class="iweb" viewBox="0 0 400 400">
<g class="ispokes"><path pathLength="1" style="--d:0.950s" d="M200 200L191.9 37.4"/><path pathLength="1" style="--d:0.985s" d="M200 200L298.7 56.8"/><path pathLength="1" style="--d:1.020s" d="M200 200L355.4 99.6"/><path pathLength="1" style="--d:1.055s" d="M200 200L367.8 213.5"/><path pathLength="1" style="--d:1.090s" d="M200 200L359.7 281.8"/><path pathLength="1" style="--d:1.125s" d="M200 200L269.9 347.0"/><path pathLength="1" style="--d:1.160s" d="M200 200L208.7 373.7"/><path pathLength="1" style="--d:1.195s" d="M200 200L95.0 352.3"/><path pathLength="1" style="--d:1.230s" d="M200 200L58.6 291.4"/><path pathLength="1" style="--d:1.265s" d="M200 200L21.1 185.7"/><path pathLength="1" style="--d:1.300s" d="M200 200L55.1 125.7"/><path pathLength="1" style="--d:1.335s" d="M200 200L125.4 42.9"/></g>
<g class="irings"><path pathLength="1" style="--d:1.35s" d="M198.3 166.0Q207.9 172.1 219.3 172.0Q221.5 179.1 228.6 181.5Q228.1 192.9 233.9 202.7Q228.9 208.2 230.3 215.5Q220.2 220.8 214.6 230.7Q207.3 229.1 201.7 234.0Q192.1 227.9 180.7 228.0Q178.5 220.9 171.4 218.5Q171.9 207.1 166.1 197.3Q171.1 191.8 169.7 184.5Q179.8 179.2 185.4 169.3Q192.7 170.9 198.3 166.0"/><path pathLength="1" style="--d:1.46s" d="M196.9 138.1Q214.4 149.2 235.2 149.0Q239.3 161.9 252.1 166.4Q251.2 187.1 261.8 205.0Q252.6 215.0 255.2 228.3Q236.8 237.9 226.6 256.0Q213.4 253.1 203.1 261.9Q185.6 250.8 164.8 251.0Q160.7 238.1 147.9 233.6Q148.8 212.9 138.2 195.0Q147.4 185.0 144.8 171.7Q163.2 162.1 173.4 144.0Q186.6 146.9 196.9 138.1"/><path pathLength="1" style="--d:1.57s" d="M195.4 108.1Q221.4 124.6 252.2 124.3Q258.3 143.4 277.3 150.1Q276.0 180.8 291.7 207.4Q278.1 222.2 281.9 242.0Q254.6 256.3 239.5 283.1Q219.8 278.7 204.6 291.9Q178.6 275.4 147.8 275.7Q141.7 256.6 122.7 249.9Q124.0 219.2 108.3 192.6Q121.9 177.8 118.1 158.0Q145.4 143.7 160.5 116.9Q180.2 121.3 195.4 108.1"/><path pathLength="1" style="--d:1.68s" d="M193.8 76.2Q228.9 98.3 270.4 97.9Q278.5 123.8 304.2 132.7Q302.5 174.2 323.6 209.9Q305.3 229.9 310.4 256.6Q273.6 275.8 253.2 312.0Q226.7 306.1 206.2 323.8Q171.1 301.7 129.6 302.1Q121.5 276.2 95.8 267.3Q97.5 225.8 76.4 190.1Q94.7 170.1 89.6 143.4Q126.4 124.2 146.8 88.0Q173.3 93.9 193.8 76.2"/><path pathLength="1" style="--d:1.79s" d="M192.1 42.2Q236.8 70.5 289.7 69.9Q300.1 102.9 332.7 114.3Q330.6 167.1 357.5 212.6Q334.1 238.1 340.6 272.1Q293.8 296.6 267.8 342.7Q234.1 335.2 207.9 357.8Q163.2 329.5 110.3 330.1Q99.9 297.1 67.3 285.7Q69.4 232.9 42.5 187.4Q65.9 161.9 59.4 127.9Q106.2 103.4 132.2 57.3Q165.9 64.8 192.1 42.2"/></g>
<g class="iknots"><circle style="--d:1.050s" cx="191.9" cy="37.4" r="4"/><circle style="--d:1.085s" cx="298.7" cy="56.8" r="4"/><circle style="--d:1.120s" cx="355.4" cy="99.6" r="4"/><circle style="--d:1.155s" cx="367.8" cy="213.5" r="4"/><circle style="--d:1.190s" cx="359.7" cy="281.8" r="4"/><circle style="--d:1.225s" cx="269.9" cy="347.0" r="4"/><circle style="--d:1.260s" cx="208.7" cy="373.7" r="4"/><circle style="--d:1.295s" cx="95.0" cy="352.3" r="4"/><circle style="--d:1.330s" cx="58.6" cy="291.4" r="4"/><circle style="--d:1.365s" cx="21.1" cy="185.7" r="4"/><circle style="--d:1.400s" cx="55.1" cy="125.7" r="4"/><circle style="--d:1.435s" cx="125.4" cy="42.9" r="4"/></g>
<g class="idew"><circle style="--d:2.00s" cx="110.0" cy="180.8" r="4.1"/><circle style="--d:2.07s" cx="78.7" cy="174.2" r="3.9"/><circle style="--d:2.14s" cx="139.4" cy="187.1" r="3.0"/><circle style="--d:2.21s" cx="330.1" cy="289.7" r="4.1"/><circle style="--d:2.28s" cx="171.6" cy="112.5" r="3.9"/><circle style="--d:2.35s" cx="187.4" cy="357.5" r="4.3"/><circle style="--d:2.42s" cx="290.0" cy="219.2" r="4.3"/></g>
    <g class="ifly"><g class="iflyb"><ellipse cx="0" cy="0" rx="16" ry="16" fill="#e8ff7a" opacity=".28"/><ellipse cx="-4" cy="-6" rx="5" ry="7" fill="#dfe8ff" opacity=".8" transform="rotate(-25)"/><ellipse cx="4" cy="-6" rx="5" ry="7" fill="#dfe8ff" opacity=".8" transform="rotate(25)"/><ellipse cx="0" cy="2" rx="5" ry="7" fill="#4a3f6e"/><circle cx="0" cy="8" r="4.5" fill="#e8ff7a"/><circle cx="0" cy="-5" r="3.2" fill="#ff7a6a"/></g></g>
    <g class="ispider"><line x1="200" y1="-700" x2="200" y2="180" stroke="#fbfaff" stroke-width="2" opacity=".85"/><g class="ispiderb"><g transform="translate(200 200) scale(2.3) translate(-50 -54)"><path d="M36.4 44.65Q28.75 31.9 22.8 50.6M36.4 51.45Q33.85 38.7 20.25 59.95M36.4 58.25Q36.4 45.5 21.95 70.15M36.4 64.2Q40.65 51.45 28.75 78.65M63.6 44.65Q71.25 31.9 77.2 50.6M63.6 51.45Q66.15 38.7 79.75 59.95M63.6 58.25Q63.6 45.5 78.05 70.15M63.6 64.2Q59.35 51.45 71.25 78.65" fill="none" stroke="#3d2f63" stroke-width="2.89" stroke-linecap="round"/><ellipse cx="50" cy="54" rx="17" ry="15.64" fill="#3d2f63"/><ellipse cx="44.9" cy="45.5" rx="5.95" ry="3.4" fill="#fff" opacity=".18"/><circle cx="43.54" cy="52.3" r="5.44" fill="#fff"/><circle cx="44.39" cy="53.15" r="2.89" fill="#1b1430"/><circle cx="45.41" cy="51.79" r="1.02" fill="#fff"/><circle cx="56.46" cy="52.3" r="5.44" fill="#fff"/><circle cx="57.31" cy="53.15" r="2.89" fill="#1b1430"/><circle cx="58.33" cy="51.79" r="1.02" fill="#fff"/><ellipse cx="38.44" cy="59.95" rx="2.89" ry="1.7" fill="#ff8fa8" opacity=".85"/><ellipse cx="61.56" cy="59.95" rx="2.89" ry="1.7" fill="#ff8fa8" opacity=".85"/><path d="M47.62 60.8q2.38 2.38 4.76 0" fill="none" stroke="#1b1430" stroke-width="1.19" stroke-linecap="round"/></g></g></g>
  </svg>
  <div class="ilogo"><div class="l1" data-t="title1"></div><div class="l2" data-t="title2"></div></div>
  <div class="icredit">KAZE Application</div>
</div>
<!-- in-play HUD: a band above the play field, so gauges and the mission never cover it -->
  <div id="hud" hidden>
    <div class="hud-silk">
      <div class="hud-label"><span id="areaName"></span></div>
      <div class="gauge">
        <span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="4" rx="2" fill="#c98a5b"/><rect x="5" y="18" width="14" height="4" rx="2" fill="#c98a5b"/><rect x="7" y="6" width="10" height="12" fill="#fbfaff"/><path d="M7 8.5h10M7 11h10M7 13.5h10M7 16h10" stroke="#b9b0d9" stroke-width="1"/><path d="M17 12c3 0 4 3 3 6" stroke="#fbfaff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>
        <div class="bar silk" id="silkBar"><i></i><b data-t="silkGauge"></b></div>
      </div>
      <div class="gauge">
        <span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12 1.5 7.5v9zM18 12l4.5-4.5v9z" fill="#ff6f9a"/><circle cx="12" cy="12" r="6.5" fill="#ff6f9a"/><path d="M8.5 10.5a4 4 0 0 1 5-3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
        <div class="bar bonus" id="bonusBar"><i style="width:0%"></i><b id="bonusLabel" data-t="bonusGauge"></b></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-top">
        <div class="score" id="score">0</div>
        <button class="icon-btn" id="pauseBtn" aria-label="pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5"/><rect x="12" y="3" width="4" height="14" rx="1.5"/></svg></button>
      </div>
      <div class="hud-sub"><span id="combo"></span><span id="bestHud"></span></div>
    </div>
    <div class="mission" id="missionBox" hidden><span class="mtime" id="mTime"></span><span class="mgoals" id="mGoals"></span><span class="mclear" data-t="missionClear"></span></div>
  </div>

<div id="stage">
  <canvas id="game" aria-label="game"></canvas>

  <!-- after a challenge clear the field freezes; a tap opens the details -->
  <div id="tapGate" hidden><div class="big" data-t="clearTitle"></div><div class="small" data-t="tapNext"></div></div>
  <div id="banner"><div class="big"></div><div class="small"></div></div>
  <div class="bubble" id="tutorial" hidden></div>
  <div class="bubble" id="hint" hidden></div>
  <div id="toast" hidden></div>

  <!-- title: an arcade-style mode select. Only the mode names turn on the drum, so the
       demo spider stays in view; tapping a mode opens its own menu -->
  <section class="screen" id="title">
    <button class="icon-btn gear" data-open="settingsScr" aria-label="settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.8.1-1.3-.1-1.3 2-1.6-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L15.4 3h-3.9l-.4 2.4a8 8 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6-.1 1.3.1 1.3-2 1.6 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3l.4 2.4h3.9l.4-2.4a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4z"/></svg></button>
    <div class="logo">
      <div class="l1" data-t="title1"></div>
      <div class="l2" data-t="title2"></div>
      <div class="tag" data-t="demoHint"></div>
      <div class="ptitle" id="tTitle" hidden></div>
    </div>
    <div class="title-panel">
      <div class="modesel">
        <button class="marrow prev" id="modePrev" aria-label="prev"><svg viewBox="0 0 20 20"><path d="M13 3 6 10l7 7"/></svg></button>
        <div class="drum-wrap" id="drumWrap">
          <div class="drum" id="drum">
            <button class="mface main" id="faceMain">
              <span class="marquee"><span data-t="modeMain"></span></span>
              <span class="mdesc" data-t="mainDesc"></span>
              <span class="mstat" id="mainStat"></span>
              <span class="mopen" data-t="tapOpen"></span>
            </button>
            <button class="mface challenge" id="faceChallenge">
              <span class="marquee"><span data-t="modeChallenge"></span></span>
              <span class="mdesc" data-t="challengeDesc"></span>
              <span class="mstat" id="chStat"></span>
              <span class="mopen" data-t="tapOpen"></span>
            </button>
          </div>
        </div>
        <button class="marrow next" id="modeNext" aria-label="next"><svg viewBox="0 0 20 20"><path d="M7 3l7 7-7 7"/></svg></button>
      </div>
      <div class="mdots" id="modeDots"><i class="on"></i><i></i><span data-t="swipeHint"></span></div>
    </div>
  </section>

  <!-- normal mode menu -->
  <section class="screen dim" id="mainScr" hidden>
    <div class="sheet mode main">
      <div class="marquee"><span data-t="modeMain"></span></div>
      <div class="statline">
        <div><b id="tLevel">1</b><span data-t="level"></span></div>
        <div><b id="tCoins">0</b><span data-t="coins"></span></div>
        <div><b id="tBest">0</b><span data-t="best"></span></div>
        <div><b id="tDay">—</b><span data-t="bestDay"></span></div>
        <div class="lvbar"><i id="tLvBar" style="width:0%"></i></div>
      </div>
      <div class="starsel" id="starSel">
        <button class="sarrow" id="starPrev" aria-label="easier"><svg viewBox="0 0 20 20"><path d="M13 3 6 10l7 7"/></svg></button>
        <div class="smid"><div class="sname" id="starName"></div><div class="srule" id="starRule"></div></div>
        <button class="sarrow" id="starNext" aria-label="harder"><svg viewBox="0 0 20 20"><path d="M7 3l7 7-7 7"/></svg></button>
      </div>
      <button class="btn primary" id="playBtn" data-t="play"></button>
      <div class="goalbox odai">
        <div class="glabel ghead"><span data-t="odaiTitle"></span><span class="drops" id="odaiDrops"></span></div>
        <ul class="goals" id="odaiList"></ul>
        <div class="onote" data-t="odaiNote"></div>
      </div>
      <div class="menu-grid three">
        <button class="btn" data-open="upgradeScr" data-t="upgrade"></button>
        <button class="btn" data-open="wardrobeScr" data-t="wardrobe"></button>
        <button class="btn" data-open="zukanScr" data-t="zukan"></button>
        <button class="btn" data-open="achScr" data-t="achievements"></button>
        <button class="btn" data-open="exchangeScr" data-t="exchange"></button>
        <button class="btn" data-open="rankScr" data-t="ranking"></button>
      </div>
      <div class="row">
        <button class="btn ghost" data-open="howtoScr" data-howto="main" data-t="howto"></button>
        <button class="btn ghost" data-close data-t="back"></button>
      </div>
    </div>
  </section>

  <!-- challenge mode: stage start -->
  <section class="screen dim" id="challengeScr" hidden>
    <div class="sheet mode challenge">
      <div class="marquee"><span data-t="modeChallenge"></span></div>
      <div class="sghead"><b id="sgTitle"></b><span id="sgSub"></span></div>
      <div class="stagedots" id="sgDots"></div>
      <div class="goalbox">
        <div class="glabel" data-t="goalsTitle"></div>
        <ul class="goals" id="sgGoals"></ul>
      </div>
      <div class="sgdress">
        <canvas id="sgDressCv"></canvas>
        <div><div class="glabel" data-t="stageDress"></div><div class="dname" id="sgDress"></div><div class="dnote" id="sgDressNote"></div></div>
      </div>
      <div class="glabel ghead"><span data-t="upgradesNow"></span><button class="link" data-open="chUpScr" data-t="upgradeListBtn"></button></div>
      <div class="chips" id="sgUps"></div>
      <button class="btn primary" id="sgStart" data-t="start"></button>
      <div class="row">
        <button class="btn ghost" data-open="howtoScr" data-howto="challenge" data-t="howto"></button>
        <button class="btn ghost" data-close data-t="back"></button>
      </div>
      <button class="link" id="sgRestart" data-t="restartNormal"></button>
      <div class="confirm" id="sgConfirm" hidden>
        <p class="lead" data-t="restartConfirm"></p>
        <div class="row"><button class="btn small" id="sgNo" data-t="back"></button><button class="btn small primary" id="sgYes" data-t="restartNormal"></button></div>
      </div>
    </div>
  </section>

  <!-- challenge mode: clear & pick an upgrade -->
  <section class="screen dim" id="clearScr" hidden>
    <div class="sheet">
      <h2 data-t="clearTitle"></h2>
      <p class="lead" id="clSub"></p>
      <dl class="kv"><dt data-t="score"></dt><dd id="clScore"></dd><dt data-t="stageCoins"></dt><dd id="clCoins"></dd></dl>
      <div class="lvup" id="clLevel" hidden></div>
      <ul class="rewards" id="clRewards" hidden></ul>
      <div class="dnote center" id="clDressNote" hidden></div>
      <p class="lead" id="clPickLead" data-t="pickUpgrade"></p>
      <button class="link" id="clUpList" data-open="chUpScr" data-t="upgradeListBtn"></button>
      <div class="list" id="pickList"></div>
      <button class="btn primary" id="clHome" data-t="home" hidden></button>
    </div>
  </section>

  <!-- challenge mode: read-only list of this run's upgrades -->
  <section class="screen dim" id="chUpScr" hidden>
    <div class="sheet">
      <h2 data-t="chUpTitle"></h2>
      <p class="lead" data-t="chUpLead"></p>
      <div class="list" id="chUpList"></div>
      <button class="btn primary" data-close data-t="back"></button>
    </div>
  </section>

  <!-- challenge mode: failed -->
  <section class="screen dim" id="failScr" hidden>
    <div class="sheet">
      <h2 data-t="failTitle"></h2>
      <p class="lead" id="fReason"></p>
      <div class="goalbox">
        <div class="glabel" data-t="progressNow"></div>
        <ul class="goals" id="fGoals"></ul>
      </div>
      <dl class="kv"><dt data-t="stageCoins"></dt><dd id="fCoins"></dd></dl>
      <div class="row">
        <button class="btn" id="fStages" data-t="toStages"></button>
        <button class="btn primary" id="fRetry" data-t="retry"></button>
      </div>
    </div>
  </section>

  <!-- pause -->
  <section class="screen dim" id="pauseScr" hidden>
    <div class="sheet">
      <canvas class="petcv" id="petCv" aria-hidden="true"></canvas>
      <h2 data-t="paused"></h2>
      <div class="pinfo" id="pauseInfo"></div>
      <button class="btn primary" id="resumeBtn" data-t="resume"></button>
      <button class="btn" id="quitBtn" data-t="quit"></button>
    </div>
  </section>

  <!-- game over / continue -->
  <section class="screen dim" id="overScr" hidden>
    <div class="sheet">
      <h2 data-t="gameover"></h2>
      <p class="lead" data-t="continueAsk"></p>
      <button class="btn primary" id="continueBtn" data-t="continueBtn"></button>
      <button class="btn ghost" id="giveUpBtn" data-t="giveUp"></button>
    </div>
  </section>

  <!-- result -->
  <section class="screen dim" id="resultScr" hidden>
    <div class="sheet">
      <h2 data-t="result"></h2>
      <div class="result-score" id="rScore">0</div>
      <div class="badge" id="rBest" data-t="newBest" hidden></div>
      <div class="napbox" id="rNap" hidden><canvas id="napCv"></canvas><span class="zzz">Zzz</span><div data-t="napText"></div></div>
      <dl class="kv">
        <dt data-t="catches"></dt><dd id="rCatches"></dd>
        <dt data-t="maxCombo"></dt><dd id="rCombo"></dd>
        <dt data-t="dayReached"></dt><dd id="rArea"></dd>
        <dt data-t="difficulty"></dt><dd id="rStar"></dd>
        <dt data-t="expGained"></dt><dd id="rExp"></dd>
        <dt data-t="coinsGained"></dt><dd id="rCoins"></dd>
      </dl>
      <div class="lvup" id="rLevel" hidden></div>
      <ul class="rewards" id="rRewards" hidden></ul>
      <div class="row">
        <button class="btn" id="homeBtn" data-t="home"></button>
        <button class="btn primary" id="retryBtn" data-t="retry"></button>
      </div>
    </div>
  </section>

  <!-- upgrade -->
  <section class="screen dim" id="upgradeScr" hidden>
    <div class="sheet">
      <h2 data-t="upgrade"></h2>
      <p class="lead" data-t="upgradeFor"></p>
      <div class="coinbar"><span data-t="coins"></span><span class="coinval"></span></div>
      <div class="list" id="upgradeList"></div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- wardrobe: spider parts, silk, knots, seasons, titles -->
  <section class="screen dim" id="wardrobeScr" hidden>
    <div class="sheet">
      <h2 data-t="wardrobe"></h2>
      <canvas class="wdpreview" id="wdPreview"></canvas>
      <div class="coinbar"><span data-t="coins"></span><span class="coinval"></span><span class="dropicon">💧</span><span class="dropval"></span></div>
      <div class="tabs" id="wdTabs"></div>
      <div class="list" id="wardrobeList"></div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- dew-drop exchange -->
  <section class="screen dim" id="exchangeScr" hidden>
    <div class="sheet">
      <h2 data-t="exchange"></h2>
      <p class="lead" data-t="exchangeLead"></p>
      <div class="coinbar"><span class="dropicon">💧</span><span data-t="drops"></span><span class="dropval"></span></div>
      <div class="list" id="exchangeList"></div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- achievements -->
  <section class="screen dim" id="achScr" hidden>
    <div class="sheet">
      <h2 data-t="achievements"></h2>
      <div class="coinbar" id="achCount"></div>
      <div class="list" id="achList"></div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- dawn charm pick (normal mode) -->
  <section class="screen dim" id="charmScr" hidden>
    <div class="sheet">
      <h2 id="charmTitle"></h2>
      <p class="lead" data-t="charmLead"></p>
      <div class="charms" id="charmList"></div>
      <div class="chips" id="charmHave"></div>
    </div>
  </section>

  <!-- zukan -->
  <section class="screen dim" id="zukanScr" hidden>
    <div class="sheet">
      <h2 data-t="zukan"></h2>
      <div class="coinbar" id="zukanCount"></div>
      <div class="tabs" id="zkTabs"><button class="on" data-zk="dex" data-t="zkDex"></button><button data-zk="shiny" data-t="zkShiny"></button><button data-zk="sets" data-t="zkSets"></button></div>
      <div class="list" id="zukanSets" hidden></div>
      <div class="zukan-grid" id="zukanGrid"></div>
      <div class="zdetail" id="zukanDetail" hidden></div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- ranking -->
  <section class="screen dim" id="rankScr" hidden>
    <div class="sheet">
      <h2 data-t="ranking"></h2>
      <ol class="ranking" id="rankList"></ol>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>

  <!-- how to -->
  <section class="screen dim" id="howtoScr" hidden>
    <div class="sheet">
      <h2 data-t="howto"></h2>
      <p class="howto" id="howtoBody"></p>
      <button class="btn" data-close data-t="close"></button>
    </div>
  </section>

  <!-- settings -->
  <section class="screen dim" id="settingsScr" hidden>
    <div class="sheet">
      <h2 data-t="settings"></h2>
      <div class="setting"><span data-t="sound"></span><button class="btn small" id="setSound"></button></div>
      <div class="setting"><span data-t="music"></span><button class="btn small" id="setMusic"></button></div>
      <div class="setting"><span data-t="vibration"></span><button class="btn small" id="setVib"></button></div>
      <div class="setting"><span data-t="language"></span><button class="btn small" id="setLang"></button></div>
      <div class="setting"><span data-t="resetData"></span><button class="btn small" id="resetBtn">!</button></div>
      <div class="sheet" id="resetConfirm" hidden style="padding:12px;gap:10px">
        <p class="lead" data-t="resetConfirm"></p>
        <div class="row"><button class="btn small" id="resetNo" data-t="back"></button><button class="btn small primary" id="resetYes" data-t="resetData"></button></div>
      </div>
      <button class="btn" data-close data-t="back"></button>
    </div>
  </section>
</div>
<div id="adSlot" aria-hidden="true">AD</div>
